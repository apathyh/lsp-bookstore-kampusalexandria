<h1>Edit Buku</h1>
<form action="buku.html" method="get" enctype="multipart/form-data" style="max-width:600px">  <label>Judul *</label><input name="judul" value="Atomic Habits (Terjemahan)" class="form-control mb-2" required>
  <label>Penulis *</label><input name="penulis" value="James Clear" class="form-control mb-2" required>
  <label>Penerbit</label><input name="penerbit" value="Gramedia" class="form-control mb-2">
  <label>Tahun terbit</label><input type="number" name="tahun" value="2019" class="form-control mb-2">
  <label>Kategori</label>
  <select name="kategori_id" class="form-select mb-2">
    <option value="0">- tanpa kategori -</option>
          <option value="1" >Novel</option>
          <option value="2" >Pemrograman</option>
          <option value="3" selected>Pengembangan Diri</option>
          <option value="4" >Sejarah</option>
      </select>
  <label>Harga (Rp)</label><input type="number" name="harga" value="98000" min="0" class="form-control mb-2" required>
  <label>Stok</label><input type="number" name="stok" value="19" min="0" class="form-control mb-2" required>
  <label>Deskripsi</label><textarea name="deskripsi" class="form-control mb-2">Cara membangun kebiasaan kecil yang berdampak besar.</textarea>
  <label>Cover (JPG, PNG, WEBP, maks 2 MB)</label>
  <div><img src="../uploads/default.svg" width="90"></div>  <input type="file" name="thumbnail" accept="image/jpeg,image/png,image/webp" class="form-control mb-3">
  <button class="btn btn-primary">Simpan</button>
  <a class="btn btn-secondary" href="buku.html">Batal</a>
</form>
